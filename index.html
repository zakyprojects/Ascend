<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    
    <!-- PWA Manifest & Theme Color -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="theme-color" content="#0a0b0f" />
    <title>Ascend - Men's Self-Improvement</title>
    <style>
      html, body {
        background-color: #0a0b0f;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes loadingBarAnim {
        0% { left: -50%; width: 50%; }
        50% { left: 25%; width: 50%; }
        100% { left: 100%; width: 50%; }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.25; transform: scale(0.98); }
        50% { opacity: 0.45; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Inlined Shell (Displays before React/JS bundle parses) -->
      <div style="position:fixed;inset:0;z-index:9999;background-color:#0a0b0f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;user-select:none;">
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;max-width:384px;">
          
          <!-- Logo Badge Container -->
          <div style="position:relative;width:80px;height:80px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;">
            <div style="position:absolute;inset:-6px;border-radius:16px;border:2px solid rgba(16,185,129,0.3);border-top-color:#10b981;"></div>
            <div style="width:80px;height:80px;border-radius:16px;background:rgba(17,19,25,0.9);border:1px solid rgba(16,185,129,0.4);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 25px -5px rgba(16,185,129,0.15);">
              <svg viewBox="0 0 64 64" style="width:44px;height:44px;border-radius:12px;" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="ascendPreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#10b981" />
                    <stop offset="100%" stop-color="#059669" />
                  </linearGradient>
                </defs>
                <rect width="64" height="64" rx="16" fill="url(#ascendPreGrad)" />
                <circle cx="32" cy="26" r="12" fill="none" stroke="#ffffff" stroke-width="3.5" />
                <path d="M25 36 L20 50 L32 44 L44 50 L39 36" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
                <circle cx="32" cy="26" r="5.5" fill="#ffffff" />
              </svg>
            </div>
          </div>

          <!-- Brand Title -->
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:20px;font-weight:700;color:#f8fafc;letter-spacing:0.025em;">Ascend</span>
            <span style="font-size:10px;background:rgba(16,185,129,0.2);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3);padding:2px 8px;border-radius:9999px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">Self Growth</span>
          </div>

          <!-- Loading Label -->
          <p style="font-size:14px;font-weight:600;color:#e2e8f0;margin:4px 0 0 0;">
            Verifying session...
          </p>
          <p style="font-size:12px;color:#94a3b8;margin:4px 0 0 0;">
            Preparing your personal growth workspace
          </p>

          <!-- Loading Bar -->
          <div style="width:144px;height:4px;background:#1e222d;border-radius:9999px;overflow:hidden;margin-top:20px;position:relative;">
            <div style="position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg, #10b981, #34d399);width:50%;border-radius:9999px;animation:loadingBarAnim 1.2s ease-in-out infinite;"></div>
          </div>

        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
