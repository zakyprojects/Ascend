    <script>
      (function() {
        try {
          var t = localStorage.getItem('ascend_theme_preference');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', t === 'light' ? '#f6f8f7' : '#0a0b0f');
          }
        } catch (e) {}
      })();

    <style>
      :root {
        --splash-bg: #0a0b0f;
        --splash-title: #f8fafc;
        --splash-text: #e2e8f0;
        --splash-subtext: #94a3b8;
        --splash-badge-bg: rgba(16, 185, 129, 0.2);
        --splash-badge-text: #6ee7b7;
        --splash-badge-border: rgba(16, 185, 129, 0.3);
      }
      [data-theme="light"] {
        --splash-bg: #f6f8f7;
        --splash-title: #0f172a;
        --splash-text: #1e293b;
        --splash-subtext: #556275;
        --splash-badge-bg: #d1fae5;
        --splash-badge-text: #047857;
        --splash-badge-border: #a7f3d0;
      }
      html, body {
        background-color: var(--splash-bg, #0a0b0f);
        color: var(--splash-text, #e2e8f0);
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* Pre-React splash loader: mirrors AscendLoaderMark (src/components/ui/AscendLoadingIndicator.tsx). */
      .splash-loader { --al-chip:#112725; --al-chip-border:#114136; --al-stairs:#059669; --al-steps:#6ee7b7; --al-leg-a-0:#10b981; --al-leg-a-1:#6ee7b7; --al-leg-b-0:#34d399; --al-leg-b-1:#059669; }
      [data-theme="light"] .splash-loader { --al-chip:#cdf2e5; --al-chip-border:#9fdfc6; --al-stairs:#047857; --al-steps:#10b981; --al-leg-a-0:#047857; --al-leg-a-1:#10b981; --al-leg-b-0:#059669; --al-leg-b-1:#065f46; }
      .splash-loader .sl-chip { fill:var(--al-chip); stroke:var(--al-chip-border); }
      .splash-loader .sl-stairs { fill:var(--al-stairs); }
      .splash-loader .sl-steps { fill:var(--al-steps); }
      .splash-loader.is-animating .sl-swoosh { display:none; }
      /* Boot stack around the chip: AscendLoadingOverlay's layers, held still. Only the chip's ribbon and the loading bar move. */
      :root { --splash-card: rgba(17,19,25,0.9); --splash-track: #171a23; }
      [data-theme="light"] { --splash-card: rgba(255,255,255,0.9); --splash-track: #f1f4f3; }
      .sp-glow { position:absolute; width:192px; height:192px; border-radius:9999px; background:rgba(16,185,129,0.15); filter:blur(64px); }
      .sp-logo { position:relative; width:80px; height:80px; margin-bottom:24px; display:flex; align-items:center; justify-content:center; }
      .sp-ping { position:absolute; inset:0; border-radius:16px; background:linear-gradient(to top right, rgba(16,185,129,0.3), rgba(52,211,153,0.2)); opacity:0.3; }
      .sp-ring { position:absolute; inset:-6px; border-radius:16px; border:2px solid rgba(16,185,129,0.2); border-top-color:#34d399; border-right-color:#34d399; }
      .sp-badge { position:relative; width:80px; height:80px; box-sizing:border-box; border-radius:16px; background:var(--splash-card); border:1px solid rgba(16,185,129,0.4); box-shadow:0 25px 50px -12px rgba(16,185,129,0.2); display:flex; align-items:center; justify-content:center; overflow:hidden; -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); }
      .sp-badge-tint { position:absolute; inset:0; background:linear-gradient(to bottom right, rgba(16,185,129,0.2), transparent, rgba(16,185,129,0.1)); }
      .sp-mark { position:relative; display:flex; }
      .sp-bar-track { width:144px; height:4px; background:var(--splash-track); border-radius:9999px; overflow:hidden; margin-top:20px; position:relative; }
      .sp-bar { position:absolute; top:0; bottom:0; left:0; width:50%; border-radius:9999px; background:linear-gradient(to right, #10b981, #34d399); animation:spLoadingBar 1.2s ease-in-out infinite; }
      @keyframes spLoadingBar { 0% { left:-50%; width:50%; } 50% { left:25%; width:50%; } 100% { left:100%; width:50%; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-bar { animation:none; }
      }
    </style>

  <body>

                    <g fill="url(#slLegA)"><path d="M45.77 2.76 L15.11 84.00 L27.68 84.00 L48.63 3.64 Z"/><path d="M15.2 84 V81.6 H26.5 Q28 81.6 28 83.1 V84 Z"/></g>

          <!-- Brand Title -->

    <script>
      // Figure-8 swoosh for the splash. KEEP IN SYNC with src/components/ui/ascendLoaderRibbon.ts.
      // Without JS, or with reduced motion, the static logo swoosh stays.
      (function() {
        var svg = document.getElementById('splash-loader');
        if (!svg || !window.requestAnimationFrame) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var back = document.getElementById('sl-ribbon-back');
        var front = document.getElementById('sl-ribbon-front');
        var CX = 48.5, CY = 42, RX = 40, RY = 15, ROT = -14 * Math.PI / 180, SPAN = 165 * Math.PI / 180;
        var SAMPLES = 48, LOOP_MS = 1600, FRAMES = 96, MAX_W = 5.2;
        var COS_R = Math.cos(ROT), SIN_R = Math.sin(ROT);
        function outline(ths, head) {
          var left = [], right = [];
          for (var i = 0; i < ths.length; i++) {
            var th = ths[i];
            var x = RX * Math.sin(th), y = RY * Math.sin(2 * th);
            var px = CX + x * COS_R - y * SIN_R, py = CY + x * SIN_R + y * COS_R;
            var dx = RX * Math.cos(th), dy = 2 * RY * Math.cos(2 * th);
            var tx = dx * COS_R - dy * SIN_R, ty = dx * SIN_R + dy * COS_R;
            var len = Math.sqrt(tx * tx + ty * ty) || 1, nx = -ty / len, ny = tx / len;
            var u = 1 - (head - th) / SPAN;
            var w = MAX_W * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.85)), 0.9) / 2;
            left.push((px + nx * w).toFixed(2) + ',' + (py + ny * w).toFixed(2));
            right.unshift((px - nx * w).toFixed(2) + ',' + (py - ny * w).toFixed(2));
          }
          return 'M' + left.join('L') + 'L' + right.join('L') + 'Z';
        }
        function frame(t) {
          var head = 2 * Math.PI * (t - 0.05 * Math.sin(2 * Math.PI * t)), tail = head - SPAN;
          var flip = Math.ceil((tail - Math.PI / 2) / Math.PI) * Math.PI + Math.PI / 2;
          var hasFlip = flip > tail && flip < head;
          var runs = [[]];
          for (var i = 0; i <= SAMPLES; i++) {
            var th = tail + SPAN * i / SAMPLES;
            if (hasFlip && th > flip && runs.length === 1) { runs[0].push(flip); runs.push([flip]); }
            runs[runs.length - 1].push(th);
          }
          var f = { back: '', front: '' };
          for (var r = 0; r < runs.length; r++) {
            var run = runs[r];
            if (run.length < 2) continue;
            f[Math.cos((run[0] + run[run.length - 1]) / 2) < 0 ? 'back' : 'front'] = outline(run, head);
          }
          return f;
        }
        var frames = [];
        for (var i = 0; i < FRAMES; i++) frames.push(frame(i / FRAMES));
        var last = -1;
        function tick(now) {
          if (!svg.isConnected) return; // React has replaced the splash
          var index = Math.floor((now % LOOP_MS) / LOOP_MS * FRAMES);
          if (index !== last) {
            last = index;
            back.setAttribute('d', frames[index].back);
            front.setAttribute('d', frames[index].front);
          }
          requestAnimationFrame(tick);
        }
        svg.classList.add('is-animating');
        requestAnimationFrame(tick);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
