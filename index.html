<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Old hash links (#/habits) become paths (/habits) before the app or Supabase loads, without a
      // new history entry. Only #/ hashes are routes: #access_token=..., #error=... and a bare # are
      // left alone for the auth client. KEEP IN SYNC with src/lib/routes.ts (the app re-checks).
      (function() {
        try {
          var h = location.hash;
          if (h.indexOf('#/') !== 0) return;
          var id = decodeURIComponent(h.slice(2)).replace(/^\/+|\/+$/g, '').toLowerCase();
          var renamed = { '': 'dashboard', 'index.html': 'dashboard', books: 'reading', prefrontal: 'prefrontal-cortex' };
          if (Object.prototype.hasOwnProperty.call(renamed, id)) id = renamed[id];
          if (!/^[a-z0-9-]+$/.test(id)) id = 'dashboard';
          history.replaceState(history.state, '', '/' + id + location.search);
        } catch (e) {}
      })();
    </script>
    <!-- Favicons & App Icons (The Streak, 2026-10-18). ?v= busts the browsers' favicon caches; bump it with the files. -->
    <link rel="icon" href="/favicon.ico?v=5" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <!-- Search results show a site icon of at least 48px (Google): the 192px app icon. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- PWA Manifest & Theme Color -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.json?v=5" />
    <meta name="theme-color" content="#0a0b0f" />
    <title>Ascend - Self-Improvement</title>

    <!-- Link previews (Open Graph / Twitter). og:image must be an absolute URL. -->
    <meta name="description" content="Self Improvement Gamified App. Train The Mind. Rise." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ascend" />
    <meta property="og:description" content="Self Improvement Gamified App. Train The Mind. Rise." />
    <meta property="og:image" content="https://ascend-neon.vercel.app/og-image.png?v=5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ascend" />
    <meta name="twitter:description" content="Self Improvement Gamified App. Train The Mind. Rise." />
    <meta name="twitter:image" content="https://ascend-neon.vercel.app/og-image.png?v=5" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ascend_theme_preference');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', t === 'light' ? '#f6f8f7' : '#0a0b0f');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --splash-bg: #0a0b0f;
        --splash-title: #f8fafc;
        --splash-text: #e2e8f0;
        --splash-subtext: #94a3b8;
        --splash-badge-bg: rgba(16, 185, 129, 0.2);
        --splash-badge-text: #6ee7b7;
        --splash-badge-border: rgba(16, 185, 129, 0.3);
      }
      [data-theme="light"] {
        --splash-bg: #f6f8f7;
        --splash-title: #0f172a;
        --splash-text: #1e293b;
        --splash-subtext: #556275;
        --splash-badge-bg: #d1fae5;
        --splash-badge-text: #047857;
        --splash-badge-border: #a7f3d0;
      }
      html, body {
        background-color: var(--splash-bg, #0a0b0f);
        color: var(--splash-text, #e2e8f0);
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* The Streak loader: AscendLoaderMark (src/components/ui/AscendLoadingIndicator.tsx) and this splash share
         these rules. The left leg's segments light bottom to top (the gaps closing), then the whole A brightens;
         1.6 s loop (STREAK_LOOP_MS), phased to the page clock by --streak-phase. Reduced motion: the still mark. */
      .streak-loader { color:var(--color-brand-mark, #10b981); overflow:visible; }
      [data-theme="light"] #splash-loader { color:#059669; }
      .streak-loader path { fill:currentColor; animation:1.6s ease-in-out var(--streak-phase, 0s) infinite both; }
      .streak-loader .sk-body { animation-name:skBody; }
      .streak-loader .sk-seg-0 { animation-name:skSeg0; }
      .streak-loader .sk-seg-1 { animation-name:skSeg1; }
      .streak-loader .sk-seg-2 { animation-name:skSeg2; }
      @keyframes skBody { 0%, 44% { opacity:.35; } 58%, 76% { opacity:1; } 94%, 100% { opacity:.35; } }
      @keyframes skSeg0 { 0%, 6% { opacity:.2; } 16%, 52% { opacity:.7; } 58%, 76% { opacity:1; } 94%, 100% { opacity:.2; } }
      @keyframes skSeg1 { 0%, 20% { opacity:.2; } 30%, 52% { opacity:.7; } 58%, 76% { opacity:1; } 94%, 100% { opacity:.2; } }
      @keyframes skSeg2 { 0%, 34% { opacity:.2; } 44%, 52% { opacity:.7; } 58%, 76% { opacity:1; } 94%, 100% { opacity:.2; } }
      @media (prefers-reduced-motion: reduce) { .streak-loader path { animation:none !important; } }
      /* Boot stack around the mark: AscendLoadingOverlay's layers, held still. Only the mark and the loading bar move. */
      :root { --splash-card: rgba(17,19,25,0.9); --splash-track: #171a23; }
      [data-theme="light"] { --splash-card: rgba(255,255,255,0.9); --splash-track: #f1f4f3; }
      .sp-glow { position:absolute; width:192px; height:192px; border-radius:9999px; background:rgba(16,185,129,0.15); filter:blur(64px); }
      .sp-logo { position:relative; width:80px; height:80px; margin-bottom:24px; display:flex; align-items:center; justify-content:center; }
      .sp-ping { position:absolute; inset:0; border-radius:16px; background:linear-gradient(to top right, rgba(16,185,129,0.3), rgba(52,211,153,0.2)); opacity:0.3; }
      .sp-ring { position:absolute; inset:-6px; border-radius:16px; border:2px solid rgba(16,185,129,0.2); border-top-color:#34d399; border-right-color:#34d399; }
      .sp-badge { position:relative; width:80px; height:80px; box-sizing:border-box; border-radius:16px; background:var(--splash-card); border:1px solid rgba(16,185,129,0.4); box-shadow:0 25px 50px -12px rgba(16,185,129,0.2); display:flex; align-items:center; justify-content:center; overflow:hidden; -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); }
      .sp-badge-tint { position:absolute; inset:0; background:linear-gradient(to bottom right, rgba(16,185,129,0.2), transparent, rgba(16,185,129,0.1)); }
      .sp-mark { position:relative; display:flex; }
      .sp-bar-track { width:144px; height:4px; background:var(--splash-track); border-radius:9999px; overflow:hidden; margin-top:20px; position:relative; }
      .sp-bar { position:absolute; top:0; bottom:0; left:0; width:50%; border-radius:9999px; background:linear-gradient(to right, #10b981, #34d399); animation:spLoadingBar 1.2s ease-in-out infinite; }
      /* Growth trace (src/components/ui/growthTrace.ts): shared by this splash and the React boot
         overlay, which keeps using these rules after it takes over. */
      .growth-trace { position:absolute; inset:0; pointer-events:none; }
      .growth-trace .gt-level { stroke:#94a3b8; stroke-opacity:.22; stroke-width:1; stroke-dasharray:2 6; }
      .growth-trace .gt-line { fill:none; stroke:#34d399; stroke-opacity:.6; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
      .growth-trace .gt-reveal, .growth-trace .gt-reveal-inner { position:absolute; inset:0; will-change:transform; }
      .growth-trace .gt-reveal { overflow:hidden; transform:translateX(-100%); }
      .growth-trace svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
      .gt-dot { position:absolute; left:0; top:0; display:block; width:7px; height:7px; border-radius:50%; background:#6ee7b7; box-shadow:0 0 6px rgba(52,211,153,.9); will-change:transform; }
      .growth-trace .gt-dot { transform:translateX(-20px); }
      .growth-trace[data-done] .gt-dot { animation:gtBreathe 2.2s ease-in-out infinite; }
      [data-theme="light"] .gt-dot { background:#059669; box-shadow:0 0 5px rgba(5,150,105,.6); }
      @keyframes gtBreathe { 50% { scale:1.45; } }
      @media (prefers-reduced-motion: reduce) { .growth-trace[data-done] .gt-dot { animation:none; } }
      /* Splash half: the straight run as plain HTML moved by transforms, so it glides on the compositor even
         while the bundle is parsing. Easing = 1 - e^(-t/1600ms) over 8s (TRACE_TAU_MS / TRACE_SPLASH_MS). */
      .gt-splash { position:absolute; inset:0; pointer-events:none; --gt-y:84vh; --gt-x1:42vw; }
      .gt-splash i { position:absolute; left:0; display:block; }
      .gt-s-level { right:0; top:var(--gt-y); height:1px; margin-top:-.5px; background:repeating-linear-gradient(90deg, rgba(148,163,184,.22) 0 2px, transparent 2px 8px); }
      .gt-s-line { top:var(--gt-y); width:var(--gt-x1); height:1.6px; margin-top:-.8px; border-radius:1px; background:rgba(52,211,153,.6); transform-origin:0 50%; transform:scaleX(0); }
      .gt-s-head { top:var(--gt-y); left:0; margin:-3.5px 0 0 -3.5px; }
      .gt-s-line, .gt-s-head { animation:8s ease-out .25s both; animation-timing-function:ease-out; animation-timing-function:linear(0.000 0%, 0.096 2%, 0.223 5%, 0.332 8%, 0.454 12%, 0.554 16%, 0.636 20%, 0.718 25%, 0.782 30%, 0.840 36%, 0.890 43%, 0.924 50%, 0.957 60%, 0.979 72%, 0.992 85%, 1.000 100%); will-change:transform; }
      .gt-s-line { animation-name:gtStraight; } .gt-s-head { animation-name:gtHead; }
      [data-theme="light"] .gt-s-level { background:repeating-linear-gradient(90deg, rgba(85,98,117,.25) 0 2px, transparent 2px 8px); }
      [data-theme="light"] .gt-s-line { background:rgba(5,150,105,.65); }
      @keyframes gtStraight { to { transform:scaleX(1); } }
      @keyframes gtHead { to { transform:translateX(var(--gt-x1)); } }
      @media (prefers-reduced-motion: reduce) { .gt-s-line, .gt-s-head { animation-duration:1ms; animation-delay:0s; } }
      /* Entrance: the stack rises in once. AscendLoadingOverlay (entrance="boot") resumes this on the same clock. */
      .sp-enter { animation:spEnter 400ms cubic-bezier(0.16,1,0.3,1) both; }
      @keyframes spEnter { 0% { opacity:0; transform:translateY(12px) scale(0.96); } 100% { opacity:1; transform:none; } }
      @keyframes spLoadingBar { 0% { left:-50%; width:50%; } 50% { left:25%; width:50%; } 100% { left:100%; width:50%; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-bar, .sp-enter { animation:none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Inlined Shell (Displays before React/JS bundle parses) -->
      <div style="position:fixed;inset:0;z-index:9999;background-color:var(--splash-bg,#0a0b0f);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;user-select:none;">
        <div id="splash-trace" class="gt-splash" aria-hidden="true"><i class="gt-s-level"></i><i class="gt-s-line"></i><i class="gt-dot gt-s-head"></i></div>
        <script>
          // Pin the trace to the same pixel geometry the React overlay's SVG uses (growthTrace.ts).
          (function() { var el = document.getElementById('splash-trace'); el.style.setProperty('--gt-y', (innerHeight * 0.84) + 'px'); el.style.setProperty('--gt-x1', (innerWidth * 0.42) + 'px'); })();
        </script>
        <!-- Background ambient glow aura -->
        <div class="sp-glow"></div>
        <div class="sp-enter" style="position:relative;display:flex;flex-direction:column;align-items:center;max-width:384px;">
          
          <!-- Logo stack (mirrors AscendLoadingOverlay): ping aura, ring, badge, animated mark -->
          <div class="sp-logo">
            <div class="sp-ping"></div>
            <div class="sp-ring"></div>
            <div class="sp-badge">
              <div class="sp-badge-tint"></div>
              <div class="sp-mark">
                <!-- The Streak mark (AscendLoaderMark, full; paths from src/components/ui/brandPaths.ts) -->
                <svg id="splash-loader" class="streak-loader" viewBox="56 56 400 400" aria-hidden="true" style="width:44px;height:44px;" xmlns="http://www.w3.org/2000/svg">
                  <path class="sk-body" d="M163.09,301.24 L221,323.4 L256,231.93 L340.81,453.56 L407.19,453.56 L256,58.44Z"/>
                  <path class="sk-seg-0" d="M179.93,430.72 L122.03,408.56 L104.81,453.56 L171.19,453.56Z"/>
                  <path class="sk-seg-1" d="M187.01,412.21 L199.99,378.29 L142.09,356.14 L129.11,390.06Z"/>
                  <path class="sk-seg-2" d="M147.04,343.18 L204.95,365.34 L217.93,331.42 L160.02,309.26Z"/>
                </svg>
                <script>
                  // Same phase as the React loader, so the handoff doesn't jump (STREAK_LOOP_MS).
                  (function() { try { document.getElementById('splash-loader').style.setProperty('--streak-phase', -(performance.now() % 1600) + 'ms'); } catch (e) {} })();
                </script>
              </div>
            </div>
          </div>

          <!-- Brand Title -->
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:20px;font-weight:700;color:var(--splash-title,#f8fafc);letter-spacing:0.025em;">Ascend</span>
            <span style="font-size:10px;background:var(--splash-badge-bg,rgba(16,185,129,0.2));color:var(--splash-badge-text,#6ee7b7);border:1px solid var(--splash-badge-border,rgba(16,185,129,0.3));padding:2px 8px;border-radius:9999px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">Self Growth</span>
          </div>

          <!-- Loading Label -->
          <p style="font-size:14px;font-weight:600;color:var(--splash-text,#e2e8f0);margin:4px 0 0 0;">
            Opening Ascend...
          </p>
          <p style="font-size:12px;color:var(--splash-subtext,#94a3b8);margin:4px 0 0 0;">
            Getting the app ready
          </p>

          <!-- Animated loader bar -->
          <div class="sp-bar-track"><div class="sp-bar"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
